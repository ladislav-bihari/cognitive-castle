name: Bounded develop pressure integration
on:
  push:
    branches: [verify/develop-pressure-integration-20261109]
permissions:
  contents: read
concurrency:
  group: bounded-layout-native-verification
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
      - run: python -m pip install pytest==9.0.3 psutil==7.2.2
      - name: Freeze scope
        id: freeze
        run: python .github/scripts/verify_pressure.py prepare
      - name: Verify lifecycle
        shell: bash
        run: |
          set +e
          python .github/scripts/verify_pressure.py run > ci-pressure-results/output.log 2>&1
          CASTLE_TEST_RC=$?
          set -e
          cat ci-pressure-results/output.log
          python .github/scripts/verify_pressure.py verify "$CASTLE_TEST_RC"
      - name: Retain synthetic evidence
        if: always() && steps.freeze.outcome == 'success'
        run: python .github/scripts/verify_pressure.py archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.freeze.outcome == 'success'
        with:
          name: pressure-evidence
          path: pressure-evidence.tar
          if-no-files-found: error
          retention-days: 7
