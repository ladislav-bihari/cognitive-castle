name: Bounded layout native verification
on:
  push:
    branches: [verify/layout-tail-remaining-20261025]
permissions:
  contents: read
concurrency:
  group: bounded-layout-native-verification
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.10"
      - name: Install fixed engine-only dependencies
        run: python -m pip install pytest==9.0.3 psutil==7.2.2 pylance==4.0.1 pyarrow==24.0.0 numpy==2.4.4
      - name: Freeze remote scope
        id: freeze
        run: python .github/scripts/verify_layout_native.py prepare
      - name: Qualify underestimated
        shell: bash
        run: |
          set +e
          python .github/scripts/verify_layout_native.py run underestimated > ci-layout-native-results/underestimated/output.log 2>&1
          CASTLE_SCOPE_RC=$?
          set -e
          cat ci-layout-native-results/underestimated/output.log
          python .github/scripts/verify_layout_native.py verify underestimated "$CASTLE_SCOPE_RC"
      - name: Qualify retained_temp
        shell: bash
        run: |
          set +e
          python .github/scripts/verify_layout_native.py run retained_temp > ci-layout-native-results/retained_temp/output.log 2>&1
          CASTLE_SCOPE_RC=$?
          set -e
          cat ci-layout-native-results/retained_temp/output.log
          python .github/scripts/verify_layout_native.py verify retained_temp "$CASTLE_SCOPE_RC"
      - name: Qualify foreign_stage
        shell: bash
        run: |
          set +e
          python .github/scripts/verify_layout_native.py run foreign_stage > ci-layout-native-results/foreign_stage/output.log 2>&1
          CASTLE_SCOPE_RC=$?
          set -e
          cat ci-layout-native-results/foreign_stage/output.log
          python .github/scripts/verify_layout_native.py verify foreign_stage "$CASTLE_SCOPE_RC"
      - name: Qualify exact_tail
        shell: bash
        run: |
          set +e
          python .github/scripts/verify_layout_native.py run exact_tail > ci-layout-native-results/exact_tail/output.log 2>&1
          CASTLE_SCOPE_RC=$?
          set -e
          cat ci-layout-native-results/exact_tail/output.log
          python .github/scripts/verify_layout_native.py verify exact_tail "$CASTLE_SCOPE_RC"
      - name: Preserve all synthetic evidence
        if: always() && steps.freeze.outcome == 'success'
        run: python .github/scripts/verify_layout_native.py archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.freeze.outcome == 'success'
        with:
          name: layout-native-evidence
          path: layout-native-evidence.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
