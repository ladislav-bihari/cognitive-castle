name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Resource supervision measures the caller too. Run its tests in a fresh
      # process without heavyweight backend imports retained by the main suite.
      - run: python scripts/run_ci_tests.py legacy
      - run: python scripts/run_ci_tests.py bounded
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Resource supervision measures the caller too. Run its tests in a fresh
      # process without heavyweight backend imports retained by the main suite.
      - run: python scripts/run_ci_tests.py legacy
      - run: python scripts/run_ci_tests.py bounded
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-windows
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: 'pip'
      - run: pip install -e ".[dev,history]"
      # Resource supervision measures the caller too. Run its tests in a fresh
      # process without heavyweight backend imports retained by the main suite.
      - run: python scripts/run_ci_tests.py legacy
      - run: python scripts/run_ci_tests.py bounded
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-macos
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    # Platform-specific implementations are measured on their supported hosts.
    # Keep the repository's 85% gate on the union, after every test job passes.
    needs: [test-linux, test-windows, test-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all platform tests to pass
        if: ${{ needs.test-linux.result != 'success' || needs.test-windows.result != 'success' || needs.test-macos.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "coverage[toml]>=7"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Require the complete six-job coverage matrix
        run: python -c "from pathlib import Path; files = list(Path('coverage-data').glob('*/.coverage')); assert len(files) == 6, files"
      - run: python -m coverage combine coverage-data/*/.coverage
      - run: python -m coverage report

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install "ruff==0.17.3"
      - run: ruff check .
      - run: ruff format --check .
