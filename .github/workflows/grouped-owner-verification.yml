name: Versioned prefix and original storage contracts
on:
  push:
    branches: [verify/develop-integration-regression-20261109]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.11"
      - run: python -m pip install pytest==9.0.3 psutil==7.2.2
      - run: python .github/scripts/verify_capture.py prepare
      - shell: bash
        run: |
          set +e
          python .github/scripts/verify_capture.py candidate > ci-capture-results/candidate.log 2>&1
          CASTLE_GREEN_RC=$?
          set -e
          cat ci-capture-results/candidate.log
          python .github/scripts/verify_capture.py verify-candidate "$CASTLE_GREEN_RC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: capture
          path: |
            ci-capture-results/*.json
            ci-capture-results/*.xml
            ci-capture-results/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  semantic:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
      - run: python -m pip install pytest==9.0.3 psutil==7.2.2
      - run: python .github/scripts/verify_semantic.py prepare
      - shell: bash
        run: |
          set +e
          python .github/scripts/verify_semantic.py candidate > ci-semantic-results/candidate.log 2>&1
          CASTLE_GREEN_RC=$?
          set -e
          cat ci-semantic-results/candidate.log
          python .github/scripts/verify_semantic.py verify-candidate "$CASTLE_GREEN_RC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: semantic
          path: |
            ci-semantic-results/*.json
            ci-semantic-results/*.xml
            ci-semantic-results/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.11"
      - run: python -m pip install pytest==9.0.3 psutil==7.2.2
      - run: python .github/scripts/verify_contracts.py prepare
      - shell: bash
        run: |
          set +e
          python .github/scripts/verify_contracts.py candidate > ci-contracts-results/candidate.log 2>&1
          CASTLE_GREEN_RC=$?
          set -e
          cat ci-contracts-results/candidate.log
          python .github/scripts/verify_contracts.py verify-candidate "$CASTLE_GREEN_RC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: contracts
          path: |
            ci-contracts-results/*.json
            ci-contracts-results/*.xml
            ci-contracts-results/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
