name: Bounded layout native verification
on:
  push:
    branches: [verify/layout-semantic-split-20261029]
permissions:
  contents: read
concurrency:
  group: bounded-layout-native-verification
  cancel-in-progress: false
jobs:
  pure:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
      - run: python -m pip install pytest==9.0.3 psutil==7.2.2
      - run: python .github/scripts/verify_grouped_owner.py prepare
      - shell: bash
        run: |
          set +e
          python .github/scripts/verify_grouped_owner.py candidate > ci-layout-semantic-pure-results/candidate.log 2>&1
          CASTLE_GREEN_RC=$?
          set -e
          cat ci-layout-semantic-pure-results/candidate.log
          python .github/scripts/verify_grouped_owner.py verify-candidate "$CASTLE_GREEN_RC"
      - run: python .github/scripts/verify_semantic_contracts.py prepare
      - shell: bash
        run: |
          set +e
          python .github/scripts/verify_semantic_contracts.py candidate > ci-layout-semantic-contract-results/candidate.log 2>&1
          CASTLE_GREEN_RC=$?
          set -e
          cat ci-layout-semantic-contract-results/candidate.log
          python .github/scripts/verify_semantic_contracts.py verify-candidate "$CASTLE_GREEN_RC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: layout-semantic-pure
          path: |
            ci-layout-semantic-pure-results
            ci-layout-semantic-contract-results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  native:
    needs: pure
    runs-on: macos-15
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.10"
      - name: Install fixed engine-only dependencies
        run: python -m pip install pytest==9.0.3 psutil==7.2.2 pylance==4.0.1 pyarrow==24.0.0 numpy==2.4.4
      - name: Freeze remote scope
        id: freeze
        run: python .github/scripts/verify_layout_native.py prepare
      - name: Qualify registered_semantic
        shell: bash
        run: |
          set +e
          python .github/scripts/verify_layout_native.py run registered_semantic > ci-layout-native-results/registered_semantic/output.log 2>&1
          CASTLE_SCOPE_RC=$?
          set -e
          cat ci-layout-native-results/registered_semantic/output.log
          python .github/scripts/verify_layout_native.py verify registered_semantic "$CASTLE_SCOPE_RC"
      - name: Preserve all synthetic evidence
        if: always() && steps.freeze.outcome == 'success'
        run: python .github/scripts/verify_layout_native.py archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.freeze.outcome == 'success'
        with:
          name: layout-native-evidence
          path: layout-native-evidence.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
