name: Versioned prefix and original storage contracts
on:
  push:
    branches: [verify/packed-facade-green-20261026]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.11"
      - run: python -m pip install pytest==9.0.3 psutil==7.2.2
      - run: python .github/scripts/verify_grouped_owner.py prepare
      - shell: bash
        run: |
          set +e
          python .github/scripts/verify_grouped_owner.py candidate > ci-packed-facade-green-results/candidate.log 2>&1
          CASTLE_GREEN_RC=$?
          set -e
          cat ci-packed-facade-green-results/candidate.log
          python .github/scripts/verify_grouped_owner.py verify-candidate "$CASTLE_GREEN_RC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: packed-facade-green
          path: ci-packed-facade-green-results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
