name: Direct live supported native qualification
on:
  push:
    branches: [verify/direct-live-native-20261110]
permissions:
  contents: read
concurrency:
  group: bounded-layout-native-verification
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"
      - run: python -m pip install pytest==9.0.3 psutil==7.2.2 pylance==4.0.1 pyarrow==24.0.0 numpy==2.4.4
      - run: python .github/scripts/direct_live_native.py prepare
      - name: happy direct native case
        if: always()
        shell: bash
        run: |
          set +e
          python .github/scripts/direct_live_native.py run happy > ci-live-native-results/happy.log 2>&1
          CASTLE_NATIVE_RC=$?
          set -e
          cat ci-live-native-results/happy.log
          python .github/scripts/direct_live_native.py verify happy "$CASTLE_NATIVE_RC"
      - name: recovery direct native case
        if: always()
        shell: bash
        run: |
          set +e
          python .github/scripts/direct_live_native.py run recovery > ci-live-native-results/recovery.log 2>&1
          CASTLE_NATIVE_RC=$?
          set -e
          cat ci-live-native-results/recovery.log
          python .github/scripts/direct_live_native.py verify recovery "$CASTLE_NATIVE_RC"
      - if: always()
        run: python .github/scripts/direct_live_native.py archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: direct-live-native
          path: ci-live-native-results/
          if-no-files-found: error
          retention-days: 7
