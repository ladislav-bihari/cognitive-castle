[project]
name = "cognitive-castle"
version = "3.4.1"
description = "Cognitive Castle — local-first persistent memory for AI agents. Verbatim, LanceDB-backed, 3-stage retrieval, no API key required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "ai", "memory", "llm", "rag", "mcp",
    "vector-database", "claude", "lancedb", "embeddings", "verbatim",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "lancedb>=0.20",
    "sentence-transformers>=3.0",
    "spacy>=3.0.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pyarrow>=14.0",
    "pyyaml>=6.0,<7",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
castle      = "cognitive_castle.entrypoint:main"
castle-mcp  = "cognitive_castle.mcp_server:main"

[project.entry-points."cognitive_castle.backends"]
lancedb = "cognitive_castle.backends.lancedb_backend:LanceDBBackend"

[project.entry-points."cognitive_castle.sources"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.17.3", "psutil>=5.9"]
memory = ["psutil>=5.9"]
history = ["psutil>=5.9", "pylance==4.0.1"]
spellcheck = ["autocorrect>=2.0"]
gpu    = ["onnxruntime-gpu>=1.16"]
dml    = ["onnxruntime-directml>=1.16"]
coreml = ["onnxruntime>=1.16"]

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.17.3", "psutil>=5.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cognitive_castle"]

[tool.ruff]
required-version = "==0.17.3"
line-length = 100
target-version = "py39"
extend-exclude = ["benchmarks", "cognitive_castle/understanding", "cognitive_castle/_vendor", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not benchmark and not slow and not stress'"
markers = [
    "benchmark: scale/performance benchmark tests",
    "slow: tests that take more than 30 seconds",
    "stress: destructive scale tests (100K+ drawers)",
]

[tool.coverage.run]
source = ["cognitive_castle"]
relative_files = true
# Vendored upstream package; Castle's adapter and integration tests remain measured.
omit = ["cognitive_castle/understanding/*", "cognitive_castle/_vendor/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
